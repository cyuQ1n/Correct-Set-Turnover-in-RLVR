# GRPO + ReMind image-text training configuration.

data:
  train_files: /path/to/train.json
  val_files: /path/to/val.json
  prompt_key: problem
  answer_key: answer
  image_key: images
  video_key: videos
  image_dir: null
  use_preprocessed_videos: false
  video_source_mode: realtime_only
  video_fps: 2.0
  video_max_frames: 128
  min_pixels: 262144
  image_max_pixels: 1048576
  video_max_pixels: 262144
  video_total_pixels: null
  max_prompt_length: 4096
  max_response_length: 4096
  filter_overlong_prompts: true
  rollout_batch_size: 256
  mini_rollout_batch_size: null
  val_batch_size: 512
  format_prompt: examples/remind/format_prompt/unified.jinja
  override_chat_template: null
  shuffle: false
  seed: 1

algorithm:
  adv_estimator: grpo
  disable_kl: true
  use_kl_loss: true
  kl_penalty: low_var_kl
  kl_coef: 0.01
  online_filtering: false
  filter_key: overall
  filter_low: 0.01
  filter_high: 0.99
  review_queue_enabled: true
  review_replace_ratio: 0.1
  review_queue_max_size: 20000
  review_queue_sample_rate: 0.25
  review_start_step: 50
  review_freq: 5
  monitor_cohort_enabled: false
  adaptive_review_freq: false
  review_freq_min: 3
  review_freq_max: 10
  adaptive_freq_window: 3
  adaptive_freq_high_threshold: 0.30
  adaptive_freq_low_threshold: 0.15
  prioritized_replay: false
  priority_base_weight: 1.0
  priority_count_weight: 2.0

worker:
  actor:
    global_batch_size: 256
    micro_batch_size_per_device_for_update: 1
    micro_batch_size_per_device_for_experience: 1
    max_grad_norm: 1.0
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
    padding_free: true
    dynamic_batching: true
    ulysses_size: 1
    model:
      model_path: /path/to/Qwen3-VL-8B-Instruct
      enable_gradient_checkpointing: true
      trust_remote_code: false
      freeze_vision_tower: false
    optim:
      lr: 1.0e-6
      weight_decay: 0.01
      strategy: adamw
      lr_warmup_ratio: 0.0
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: false
      enable_rank0_init: true
    offload:
      offload_params: true
      offload_optimizer: true
  rollout:
    n: 8
    temperature: 1.0
    top_p: 1.0
    limit_images: 0
    gpu_memory_utilization: 0.8
    enforce_eager: false
    enable_chunked_prefill: true
    tensor_parallel_size: 4
    max_num_batched_tokens: 32768
    disable_tqdm: false
    enable_mix_policy: false
    val_override_config:
      temperature: 0.7
      top_p: 0.8
      top_k: 20
      repetition_penalty: 1.0
      presence_penalty: 1.5
      n: 1
  ref:
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: true
      enable_rank0_init: true
    offload:
      offload_params: false
  reward:
    reward_function: examples/remind/reward_function/unified.py:compute_score

trainer:
  total_epochs: 1
  max_steps: null
  project_name: remind
  experiment_name: grpo-remind
  logger: ["console", "file"]
  nnodes: 1
  n_gpus_per_node: 8
  max_try_make_batch: 20
  val_freq: 5
  val_before_train: true
  val_only: false
  val_generations_to_log: 100000000
  save_freq: 20
  save_limit: 10
  save_model_only: false
  save_checkpoint_path: null
  load_checkpoint_path: null
  find_last_checkpoint: false
